name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bridge
        run: python -m pip install -e "windows_bridge[dev]"
      - name: Bridge tests
        run: python -m pytest windows_bridge/tests -q
      - name: Bridge lint
        run: python -m ruff check windows_bridge/m5vibe windows_bridge/tests
      - name: Bridge version
        run: python -m m5vibe --version
